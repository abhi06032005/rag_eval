name: Reevaluation artifact checks

on:
  push:
    branches: ["codex/full-beir-reevaluation"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare per-query matrices against saved registry
        run: python scripts/verify_reevaluation_artifacts.py

  research-web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build -- --webpack
