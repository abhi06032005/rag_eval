name: Evaluation evidence and scoped tests

on:
  push:
    branches:
      - 'feat/evidence-backed-evaluation-report-20261024'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Generate and validate archived benchmark matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate artifact-backed matrices
        run: python scripts/build_evaluation_matrix_report.py
      - name: Verify generated report against source artifacts
        run: python scripts/build_evaluation_matrix_report.py --check
      - name: Commit report artifacts to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/evidence-backed-evaluation-report-20261024'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/EVALUATION_MATRIX_REPORT.md results/evaluation_matrix_report.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(eval): save generated evidence-backed evaluation matrices"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  scoped-tests:
    name: Execute deterministic retrieval and evaluation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install pytest numpy pandas pydantic pydantic-settings pyyaml tiktoken
      - name: Run retrieval, bootstrap, IDs, chunking, and QA tests
        run: |
          python -m pytest -q tests/unit/test_bootstrap.py tests/unit/test_retrieval_metrics.py tests/unit/test_retrieval_policies.py tests/unit/test_ids.py tests/unit/test_qa_labels.py tests/unit/test_chunking.py tests/unit/test_state_atomic.py

  website:
    name: Build research Next.js website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
