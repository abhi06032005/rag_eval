version: 1

selection_metric:
  primary: retrieval_recall_at_10
  secondary:
    - p95_retrieval_ms
    - peak_qdrant_rss_mb

stages:

  representation:
    fixed:
      vector_db: qdrant
      distance: cosine
      hnsw_m: 16
      ef_construct: 128
      hnsw_ef: 64
      quantization: none
      k: 10

    grid:
      embedding_model:
        - intfloat/e5-small-v2
        - BAAI/bge-small-en-v1.5
        - BAAI/bge-m3

      chunk_size_tokens:
        - 128
        - 256
        - 448

      overlap_tokens:
        - 0
        - 32

  index:
    inherit_best_from: representation

    grid:
      hnsw_m:
        - 8
        - 16
        - 32

      ef_construct:
        - 64
        - 128

      quantization:
        - none
        - scalar
        - binary
        - product_x16

      hnsw_ef:
        - 32
        - 64
        - 128

      k:
        - 5
        - 10
        - 20

      score_threshold:
        - none
        - dev_q05_gold
        - dev_max_f1

  generation:
    retrieval_selection: pareto_top_6

    generator:
      - llama3.2:3b
      - llama3.1:8b

    temperature:
      - 0

  load:
    end_to_end_selection: pareto_top_3

    retrieve_rps:
      - 10
      - 25
      - 50
      - 100
      - 200

    ask_rps:
      - 0.5
      - 1
      - 2
      - 5
      - 10