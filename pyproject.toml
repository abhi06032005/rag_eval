[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragscalebench"
version = "0.1.0"
description = "Production-grade research benchmark for retrieval-augmented generation systems at scale"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RAGScaleBench contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "qdrant-client>=1.11.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
    "matplotlib>=3.9.0",
    "psutil>=6.0.0",
    "click>=8.1.7",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ragbench", "app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]